version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: recovery-compass-api
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rc_network

  db:
    image: postgres:16-alpine
    container_name: recovery-compass-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: recovery_compass_pass
      POSTGRES_DB: recovery_compass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d recovery_compass']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rc_network

  redis:
    image: redis:7-alpine
    container_name: recovery-compass-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rc_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: recovery-compass-mail
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - rc_network

  minio:
    image: minio/minio:latest
    container_name: recovery-compass-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - rc_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:

networks:
  rc_network:
    driver: bridge
